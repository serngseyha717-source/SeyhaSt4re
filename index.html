<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seyha Anime KH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07070b;
    --card:#14141d;
    --border:#292934;
    --purple:#8b45e8;
    --purple2:#6d28d9;
    --muted:#999;
}

body{
    background:var(--bg);
    color:#fff;
    font-family:Arial,sans-serif;
}

/* NAVBAR */

.navbar{
    height:64px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#101016f5;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:19px;
    font-weight:900;
}

.logo span{
    color:#a96aff;
}

.nav-right{
    display:flex;
    gap:9px;
    align-items:center;
}

button{
    font:inherit;
}

.menu-button,
.language-top{
    background:#181820;
    color:#fff;
    border:1px solid #383842;
    border-radius:8px;
    cursor:pointer;
}

.menu-button{
    width:42px;
    height:42px;
    font-size:21px;
}

.language-top{
    padding:9px 12px;
}

/* HERO */

.hero{
    min-height:370px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:55px 18px;

    background:
        linear-gradient(#08080ddd,#08080df5),
        url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1800&q=80");

    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:clamp(34px,7vw,58px);
    margin-bottom:10px;
}

.hero p{
    color:#aaa;
    margin-bottom:25px;
}

/* SEARCH */

.search{
    width:min(720px,94vw);
    height:56px;
    display:flex;
    background:#15151e;
    border:1px solid #3a3a46;
    border-radius:11px;
    overflow:hidden;
}

.search input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    padding:0 17px;
    font-size:15px;
}

.search button{
    width:110px;
    border:0;
    background:linear-gradient(135deg,#a65cff,#7028dc);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* CONTENT */

.container{
    width:90%;
    max-width:1450px;
    margin:40px auto;
}

.section-title{
    font-size:24px;
    margin-bottom:18px;
}

.section-title span{
    color:#a96aff;
}

/* TABS */

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:25px;
}

.tab{
    flex-shrink:0;
    padding:9px 15px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#15151d;
    color:#aaa;
    cursor:pointer;
}

.tab.active,
.tab:hover{
    background:var(--purple2);
    color:#fff;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:17px;
}

.card{
    position:relative;
    overflow:hidden;
    background:var(--card);
    border:1px solid #22222c;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#7838d7;
}

.poster{
    width:100%;
    height:270px;
    object-fit:cover;
    display:block;
    background:#1b1b24;
}

.info{
    padding:11px;
}

.title{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:6px;
}

.meta{
    font-size:11px;
    color:var(--muted);
}

.rating{
    font-size:11px;
    color:#ffc857;
    margin-top:5px;
}

/* FAVORITE */

.favorite{
    position:absolute;
    top:8px;
    right:8px;
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#000c;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    z-index:3;
}

.favorite.active{
    color:#ff4b91;
}

/* STATUS */

.status{
    text-align:center;
    color:#aaa;
    padding:35px;
    display:none;
}

.status.error{
    display:block;
    color:#ff9f9f;
}

.spinner{
    width:35px;
    height:35px;
    border:3px solid #333;
    border-top-color:#9b59ff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* LOAD MORE */

.load-area{
    text-align:center;
    margin:30px;
}

.load-more{
    display:none;
    padding:12px 26px;
    border:1px solid #8240e4;
    border-radius:8px;
    background:#702bd8;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* MENU */

.overlay{
    position:fixed;
    inset:0;
    background:#000b;
    z-index:2000;
    display:none;
}

.overlay.show{
    display:block;
}

.drawer{
    position:fixed;
    right:0;
    top:0;
    width:min(340px,88vw);
    height:100%;
    background:#111119;
    border-left:1px solid #292934;
    z-index:2100;
    transform:translateX(100%);
    transition:.25s;
    padding:22px;
}

.drawer.show{
    transform:translateX(0);
}

.drawer-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.close{
    background:none;
    border:0;
    color:#fff;
    font-size:28px;
    cursor:pointer;
}

.drawer-label{
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    margin:18px 4px 9px;
}

.language-buttons{
    display:flex;
    gap:8px;
}

.language-buttons button,
.drawer-item{
    border:1px solid #343440;
    background:#191923;
    color:#bbb;
    border-radius:8px;
    padding:12px;
    cursor:pointer;
}

.language-buttons button{
    flex:1;
}

.language-buttons .selected{
    background:#762de0;
    color:#fff;
}

.drawer-item{
    display:block;
    width:100%;
    text-align:left;
    margin:5px 0;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#000d;
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,96vw);
    max-height:90vh;
    overflow:auto;
    background:#15151e;
    border:1px solid #30303c;
    border-radius:14px;
    padding:24px;
}

.modal-close{
    float:right;
    border:0;
    background:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
}

.detail{
    display:flex;
    gap:25px;
}

.detail-poster{
    width:220px;
    height:320px;
    object-fit:cover;
    border-radius:9px;
}

.detail h2{
    font-size:27px;
    margin:24px 0 10px;
}

.detail p{
    color:#aaa;
    line-height:1.7;
}

.detail-line{
    color:#aaa;
    font-size:13px;
    margin:7px 0;
}

.official{
    display:inline-block;
    margin-top:15px;
    padding:10px 15px;
    border-radius:8px;
    background:#702bd8;
    color:#fff;
    text-decoration:none;
}

/* FOOTER */

footer{
    margin-top:70px;
    padding:30px;
    text-align:center;
    color:#666;
    background:#101016;
}

/* MOBILE */

@media(max-width:1100px){
    .grid{
        grid-template-columns:repeat(5,1fr);
    }
}

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:650px){
    .grid{
        grid-template-columns:repeat(3,1fr);
        gap:11px;
    }

    .poster{
        height:215px;
    }
}

@media(max-width:500px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .poster{
        height:245px;
    }

    .language-top{
        display:none;
    }

    .detail{
        flex-direction:column;
    }

    .detail-poster{
        width:170px;
        height:245px;
        margin:auto;
    }

    .detail h2{
        font-size:22px;
    }
}
</style>
</head>

<script>

"use strict";


/*
==================================================
API
==================================================
*/

const JIKAN =
    "https://api.jikan.moe/v4";

const KITSU =
    "https://kitsu.io/api/edge";

const LIMIT = 12;


let page = 1;

let mode = "top";

let query = "";

let hasNext = false;

let busy = false;


let language =
    localStorage.getItem("language") || "en";


let favorites =
    JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );


const $ =
    id => document.getElementById(id);


/*
==================================================
LANGUAGE
==================================================
*/

const text = {

    en:{

        hero:"Find Your Anime",

        subtitle:
            "Search thousands of anime titles",

        search:"Search",

        top:"Top Anime",

        season:"Seasonal Anime",

        fav:"Favorites",

        no:"No anime found.",

        loading:"Loading...",

        load:"Load More",

        error:
            "Anime server is busy. Please try again."

    },

    kh:{

        hero:
            "ស្វែងរក Anime របស់អ្នក",

        subtitle:
            "ស្វែងរក Anime រាប់ពាន់ចំណងជើង",

        search:
            "ស្វែងរក",

        top:
            "Anime ល្បីៗ",

        season:
            "Anime រដូវកាល",

        fav:
            "ចំណូលចិត្ត",

        no:
            "រកមិនឃើញ Anime ទេ។",

        loading:
            "កំពុងផ្ទុក...",

        load:
            "បង្ហាញបន្ថែម",

        error:
            "Server Anime កំពុងរវល់។ សូមសាកម្ដងទៀត។"

    }

};


function applyLanguage(){

    const t =
        text[language];


    $("heroTitle").textContent =
        t.hero;


    $("heroSubtitle").textContent =
        t.subtitle;


    $("searchButton").textContent =
        t.search;


    $("loadingText").textContent =
        t.loading;


    $("loadMore").textContent =
        t.load;


    $("languageTop").textContent =
        language === "en"
        ? "🇬🇧 EN"
        : "🇰🇭 KH";


    $("englishButton")
        .classList
        .toggle(
            "selected",
            language === "en"
        );


    $("khmerButton")
        .classList
        .toggle(
            "selected",
            language === "kh"
        );


    updateSectionTitle();

}


function setLanguage(value){

    language = value;

    localStorage.setItem(
        "language",
        value
    );

    applyLanguage();

}


function updateSectionTitle(){

    const t =
        text[language];


    if(mode === "season"){

        $("sectionTitle").textContent =
            t.season;

    }

    else if(mode === "favorites"){

        $("sectionTitle").textContent =
            t.fav;

    }

    else{

        $("sectionTitle").textContent =
            t.top;

    }

}


/*
==================================================
LOADING
==================================================
*/

function setLoading(value){

    $("loading").style.display =
        value
        ? "block"
        : "none";

}


function showError(message){

    $("error").textContent =
        message || text[language].error;

    $("error").style.display =
        "block";

}


/*
==================================================
TABS
==================================================
*/

function activateTab(id){

    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    if(id){

        $(id)
            .classList
            .add("active");

    }

}


/*
==================================================
FAVORITES
==================================================
*/

function saveFavorites(){

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

}


function isFavorite(id){

    return favorites.some(
        anime =>
            String(anime.mal_id) ===
            String(id)
    );

}


function toggleFavorite(anime){

    const index =
        favorites.findIndex(
            x =>
                String(x.mal_id) ===
                String(anime.mal_id)
        );


    if(index >= 0){

        favorites.splice(
            index,
            1
        );

    }

    else{

        favorites.push(anime);

    }


    saveFavorites();


    if(mode === "favorites"){

        renderFavorites();

    }

}


/*
==================================================
FETCH
==================================================
*/

async function fetchJSON(
    url,
    timeout = 10000
){

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            () =>
                controller.abort(),
            timeout
        );


    try{

        const response =
            await fetch(
                url,
                {
                    signal:
                        controller.signal,

                    cache:
                        "no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        return await response.json();

    }

    finally{

        clearTimeout(timer);

    }

}


/*
==================================================
KITSU FALLBACK
==================================================
*/

function kitsuToAnime(item){

    const attributes =
        item.attributes || {};


    const poster =
        attributes.posterImage || {};


    return {

        mal_id:
            item.id,

        title:
            attributes.titles?.en ||
            attributes.titles?.en_jp ||
            attributes.canonicalTitle ||
            "Unknown Anime",

        title_english:
            attributes.titles?.en ||
            null,

        images:{
            jpg:{
                large_image_url:
                    poster.large ||
                    poster.original ||
                    poster.medium ||
                    ""
            }
        },

        episodes:
            attributes.episodeCount,

        score:
            attributes.averageRating
            ? Number(
                attributes.averageRating
            ) / 10
            : null,

        synopsis:
            attributes.synopsis ||
            "No description available.",

        year:
            attributes.startDate
            ? Number(
                String(
                    attributes.startDate
                ).slice(0,4)
            )
            : null,

        url:
            "https://kitsu.io/anime/" +
            item.id

    };

}


/*
==================================================
GET ANIME
==================================================
*/

async function getAnimeList(){

    let jikanURL;


    if(mode === "search"){

        jikanURL =
            JIKAN +
            "/anime?q=" +
            encodeURIComponent(query) +
            "&page=" +
            page +
            "&limit=" +
            LIMIT +
            "&sfw=true";

    }

    else if(mode === "season"){

        jikanURL =
            JIKAN +
            "/seasons/now?page=" +
            page +
            "&limit=" +
            LIMIT;

    }

    else{

        jikanURL =
            JIKAN +
            "/top/anime?page=" +
            page +
            "&limit=" +
            LIMIT;

    }


    /*
    JIKAN
    */

    try{

        const data =
            await fetchJSON(
                jikanURL
            );


        return {

            list:
                data.data || [],

            next:
                !!data.pagination
                    ?.has_next_page

        };

    }

    catch(error){

        console.log(
            "Jikan failed. Trying Kitsu..."
        );

    }


    /*
    KITSU FALLBACK
    */

    let kitsuURL =
        KITSU +
        "/anime?page[limit]=" +
        LIMIT +
        "&page[offset]=" +
        ((page - 1) * LIMIT);


    if(mode === "search"){

        kitsuURL =
            KITSU +
            "/anime?filter[text]=" +
            encodeURIComponent(query) +
            "&page[limit]=" +
            LIMIT +
            "&page[offset]=" +
            ((page - 1) * LIMIT);

    }


    const data =
        await fetchJSON(
            kitsuURL
        );


    const list =
        (data.data || [])
        .map(kitsuToAnime);


    return {

        list:list,

        next:
            list.length === LIMIT

    };

}


/*
==================================================
RENDER
==================================================
*/

function render(
    list,
    append = false
){

    const grid =
        $("grid");


    if(!append){

        grid.innerHTML = "";

    }


    $("empty").style.display =
        "none";


    if(
        !list.length &&
        !append
    ){

        $("empty").textContent =
            text[language].no;

        $("empty").style.display =
            "block";

        $("loadMore").style.display =
            "none";

        return;

    }


    list.forEach(
        anime => {
