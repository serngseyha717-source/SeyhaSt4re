<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seyha Anime KH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07070b;
    --bg2:#101017;
    --card:#14141d;
    --border:#262631;
    --purple:#9b59ff;
    --purple2:#712de0;
    --white:#fff;
    --muted:#92929f;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
}

/* NAVBAR */

.navbar{
    height:68px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#101016ee;
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:900;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#b66cff,#6725e8);
    box-shadow:0 0 25px #7b32e955;
}

.logo-purple{
    color:#a96aff;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.language-top{
    background:#181820;
    border:1px solid #33333e;
    color:white;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
}

.menu-button{
    width:42px;
    height:42px;
    border-radius:9px;
    border:1px solid #33333e;
    background:#181820;
    color:white;
    font-size:21px;
    cursor:pointer;
}

.menu-button:hover{
    background:var(--purple2);
}

/* HERO */

.hero{
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
    background:
        linear-gradient(#08080dcc,#08080df5),
        url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1800&q=85");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:clamp(35px,6vw,60px);
    margin-bottom:12px;
}

.hero p{
    color:#aaa;
    margin-bottom:28px;
}

.search{
    width:min(750px,92vw);
    height:58px;
    display:flex;
    overflow:hidden;
    border-radius:12px;
    border:1px solid #393944;
    background:#15151e;
    box-shadow:0 15px 50px #0009;
}

.search input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:0 18px;
    font-size:15px;
}

.search button{
    width:115px;
    border:0;
    background:linear-gradient(135deg,#a65cff,#7028dc);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* CONTENT */

.container{
    width:90%;
    max-width:1450px;
    margin:42px auto;
}

.section-title{
    font-size:25px;
    margin-bottom:20px;
}

.section-title span{
    color:#a96aff;
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:28px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex-shrink:0;
    border:1px solid var(--border);
    background:#15151d;
    color:#aaa;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
}

.tab:hover,
.tab.active{
    color:white;
    background:var(--purple2);
    border-color:#9250ee;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:18px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:10px;
    background:var(--card);
    border:1px solid #20202a;
    cursor:pointer;
    animation:cardIn .35s ease both;
    transition:.25s;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card:hover{
    transform:translateY(-6px);
    border-color:#7838d7;
    box-shadow:0 15px 35px #0009;
}

.poster{
    width:100%;
    height:275px;
    object-fit:cover;
    display:block;
    background:#1b1b24;
}

.info{
    padding:12px;
}

.title{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:7px;
}

.meta{
    font-size:11px;
    color:var(--muted);
}

.rating{
    margin-top:6px;
    font-size:11px;
    color:#ffc857;
}

.favorite{
    position:absolute;
    top:8px;
    right:8px;
    width:33px;
    height:33px;
    border:0;
    border-radius:50%;
    background:#000c;
    color:white;
    font-size:18px;
    cursor:pointer;
    z-index:5;
}

.favorite.active{
    color:#ff4b91;
}

/* LOAD MORE */

.load-area{
    display:flex;
    justify-content:center;
    margin:35px 0;
}

.load-more{
    display:none;
    padding:13px 28px;
    border:1px solid #8240e4;
    border-radius:9px;
    background:#702bd8;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.load-more:hover{
    background:#8c40ed;
}

.load-more.loading{
    opacity:.6;
    pointer-events:none;
}

/* LOADING */

.loading{
    display:none;
    justify-content:center;
    padding:45px;
}

.spinner{
    width:36px;
    height:36px;
    border:3px solid #333;
    border-top-color:#9b59ff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* EMPTY */

.empty{
    display:none;
    text-align:center;
    padding:60px;
    color:#777;
}

/* DRAWER */

.overlay{
    position:fixed;
    inset:0;
    background:#000b;
    z-index:2000;
    display:none;
}

.overlay.show{
    display:block;
}

.drawer{
    position:fixed;
    top:0;
    right:0;
    width:min(340px,88vw);
    height:100%;
    background:#111119;
    border-left:1px solid #292934;
    z-index:2100;
    transform:translateX(100%);
    transition:.3s ease;
    padding:22px;
    box-shadow:-20px 0 60px #0009;
}

.drawer.show{
    transform:translateX(0);
}

.drawer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

.drawer-header h2{
    font-size:19px;
}

.close{
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.drawer-label{
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    margin:18px 5px 9px;
}

.language-buttons{
    display:flex;
    gap:8px;
}

.language-buttons button{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:1px solid #343440;
    background:#191923;
    color:#aaa;
    cursor:pointer;
}

.language-buttons button.selected{
    background:#762de0;
    color:white;
    border-color:#9955ff;
}

.drawer-item{
    width:100%;
    text-align:left;
    border:0;
    border-radius:8px;
    padding:14px;
    background:transparent;
    color:#bbb;
    font-size:15px;
    cursor:pointer;
}

.drawer-item:hover{
    background:#22202d;
    color:white;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#000d;
    z-index:3000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,95vw);
    max-height:90vh;
    overflow:auto;
    background:#15151e;
    border:1px solid #30303c;
    border-radius:14px;
    padding:25px;
}

.modal-close{
    float:right;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.detail{
    display:flex;
    gap:25px;
}

.detail-poster{
    width:220px;
    height:320px;
    object-fit:cover;
    border-radius:9px;
}

.detail h2{
    font-size:28px;
    margin:25px 0 12px;
}

.detail p{
    color:#aaa;
    line-height:1.7;
}

.detail-line{
    color:#aaa;
    font-size:13px;
    margin:7px 0;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:15px 0;
}

.tag{
    background:#24202f;
    color:#cdaeff;
    padding:6px 9px;
    border-radius:6px;
    font-size:11px;
}

/* FOOTER */

footer{
    margin-top:80px;
    padding:35px;
    text-align:center;
    color:#666;
    background:#101016;
}

/* RESPONSIVE */

@media(max-width:1100px){
    .grid{
        grid-template-columns:repeat(5,1fr);
    }
}

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:650px){
    .grid{
        grid-template-columns:repeat(3,1fr);
        gap:12px;
    }

    .poster{
        height:220px;
    }
}

@media(max-width:500px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .poster{
        height:250px;
    }

    .language-top{
        display:none;
    }

    .detail{
        flex-direction:column;
    }

    .detail-poster{
        width:170px;
        height:245px;
        margin:auto;
    }

    .detail h2{
        font-size:22px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        <div class="logo-icon">✦</div>
        <div>
            Seyha <span class="logo-purple">Anime KH</span>
        </div>
    </div>

    <div class="nav-right">

        <button
            class="language-top"
            id="languageTop"
            onclick="toggleLanguage()">
            🇬🇧 EN
        </button>

        <button
            class="menu-button"
            onclick="openMenu()">
            ☰
        </button>

    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <div>

        <h1 id="heroTitle">
            Find Your Anime
        </h1>

        <p id="heroSubtitle">
            Search thousands of anime titles
        </p>

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search anime..."
                autocomplete="off">

            <button
                id="searchButton"
                onclick="startSearch()">
                Search
            </button>

        </div>

    </div>

</section>


<!-- MAIN -->

<main class="container">

    <h2 class="section-title">
        🔥 <span id="sectionTitle">Top Anime</span>
    </h2>

    <div class="tabs">

        <button
            class="tab active"
            onclick="loadTop(this)">
            🔥 Top
        </button>

        <button
            class="tab"
            onclick="loadSeason(this)">
            🆕 Seasonal
        </button>

        <button
            class="tab"
            onclick="showFavorites(this)">
            ❤️ Favorites
        </button>

    </div>


    <div
        id="loading"
        class="loading">

        <div class="spinner"></div>

    </div>


    <div
        id="grid"
        class="grid">
    </div>


    <div
        id="empty"
        class="empty">
        No anime found.
    </div>


    <div class="load-area">

        <button
            id="loadMore"
            class="load-more"
            onclick="loadMore()">

            Load More

        </button>

    </div>

</main>


<footer>
    Seyha Anime KH © 2026
</footer>


<!-- SIDE MENU -->

<div
    id="overlay"
    class="overlay"
    onclick="closeMenu()">
</div>


<aside
    id="drawer"
    class="drawer">

    <div class="drawer-header">

        <h2>
            Seyha Anime KH
        </h2>

        <button
            class="close"
            onclick="closeMenu()">
            ×
        </button>

    </div>


    <div class="drawer-label">
        Language / ភាសា
    </div>


    <div class="language-buttons">

        <button
            id="englishButton"
            onclick="setLanguage('en')">
            🇬🇧 English
        </button>

        <button
            id="khmerButton"
            onclick="setLanguage('kh')">
            🇰🇭 ខ្មែរ
        </button>

    </div>


    <div class="drawer-label">
        Navigation
    </div>


    <button
        class="drawer-item"
        onclick="loadTop();closeMenu()">

        🔥 <span
            data-en="Top Anime"
            data-kh="Anime ល្បីៗ">
            Top Anime
        </span>

    </button>


    <button
        class="drawer-item"
        onclick="loadSeason();closeMenu()">

        🆕 <span
            data-en="Seasonal Anime"
            data-kh="Anime រដូវកាល">
            Seasonal Anime
        </span>

    </button>


    <button
        class="drawer-item"
        onclick="showFavorites();closeMenu()">

        ❤️ <span
            data-en="Favorites"
            data-kh="ចំណូលចិត្ត">
            Favorites
        </span>

    </button>

</aside>


<!-- DETAIL MODAL -->

<div
    id="modal"
    class="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeModal()">
            ×
        </button>

        <div id="detailContent"></div>

    </div>

</div>


<script>

const API = "https://api.jikan.moe/v4";

let currentPage = 1;
let currentMode = "top";
let currentQuery = "";
let hasNextPage = false;

let language =
    localStorage.getItem("language") || "en";

let favorites =
    JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );


/* LANGUAGE */

const text = {

    en:{
        hero:"Find Your Anime",
        subtitle:"Search thousands of anime titles",
        search:"Search",
        top:"Top Anime",
        no:"No anime found.",
        load:"Load More",
        loading:"Loading..."
    },

    kh:{
        hero:"ស្វែងរក Anime របស់អ្នក",
        subtitle:"ស្វែងរក Anime រាប់ពាន់ចំណងជើង",
        search:"ស្វែងរក",
        top:"Anime ល្បីៗ",
        no:"រកមិនឃើញ Anime ទេ។",
        load:"បង្ហាញបន្ថែម",
        loading:"កំពុងផ្ទុក..."
    }

};


function setLanguage(value){

    language=value;

    localStorage.setItem(
        "language",
        language
    );

    applyLanguage();

    closeMenu();

}


function toggleLanguage(){

    setLanguage(
        language === "en"
        ? "kh"
        : "en"
    );

}


function applyLanguage(){

    const t=text[language];

    document.getElementById("heroTitle")
        .textContent=t.hero;

    document.getElementById("heroSubtitle")
        .textContent=t.subtitle;

    document.getElementById("searchButton")
        .textContent=t.search;

    document.getElementById("sectionTitle")
        .textContent=t.top;

    document.getElementById("empty")
        .textContent=t.no;

    document.getElementById("loadMore")
        .textContent=t.load;

    document.getElementById("languageTop")
        .textContent =
        language==="en"
        ? "🇬🇧 EN"
        : "🇰🇭 KH";

    document.querySelectorAll("[data-en]")
        .forEach(element=>{

            element.textContent =
                element.dataset[language];

        });

    document.getElementById("englishButton")
        .classList.toggle(
            "selected",
            language==="en"
        );

    document.getElementById("khmerButton")
        .classList.toggle(
            "selected",
            language==="kh"
        );

}


applyLanguage();


/* API REQUEST */

async function api(url){

    const response =
        await fetch(url);

    if(!response.ok){

        throw new Error(
            "API request failed"
        );

    }

    return response.json();

}


/* LOADING */

function setLoading(value){

    document.getElementById("loading")
        .style.display =
        value ? "flex" : "none";

}


/* TOP */

async function loadTop(button){

    if(button)
        activateTab(button);

    currentMode="top";
    currentPage=1;
    currentQuery="";

    document.getElementById("grid")
        .innerHTML="";

    document.getElementById("empty")
        .style.display="none";

    hideLoadMore();

    setLoading(true);

    try{

        const result =
            await api(
                API+
                "/top/anime?page="+
                currentPage+
                "&limit=24"
            );

        hasNextPage =
            result.pagination?.has_next_page || false;

        render(result.data || []);

        updateLoadButton();

    }catch(error){

        showError();

    }

    setLoading(false);

}


/* SEASON */

async function loadSeason(button){

    if(button)
        activateTab(button);

    currentMode="season";
    currentPage=1;
    currentQuery="";

    document.getElementById("grid")
        .innerHTML="";

    document.getElementById("empty")
        .style.display="none";

    hideLoadMore();

    setLoading(true);

    try{

        const result =
            await api(
                API+
                "/seasons/now?page="+
                currentPage+
                "&limit=24"
            );

        hasNextPage =
            result.pagination?.has_next_page || false;

        render(result.data || []);

        updateLoadButton();

    }catch(error){

        showError();

    }

    setLoading(false);

}


/* SEARCH */

let searchTimer;

document.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        clearTimeout(searchTimer);

        const value =
            this.value.trim();

        if(!value){

            loadTop();

            return;

        }

        searchTimer =
            setTimeout(
                ()=>startSearch(value),
                450
            );

    }
);


async function startSearch(value){

    value =
        value ||
        document.getElementById("searchInput")
            .value.trim();

    if(!value)
        return;

    currentMode="search";
    currentPage=1;
    currentQuery=value;

    document.getElementById("grid")
        .innerHTML="";

    document.getElementById("empty")
        .style.display="none";

    hideLoadMore();

    setLoading(true);

    try{

        const result =
            await api(
                API+
                "/anime?q="+
                encodeURIComponent(value)+
                "&page="+
                currentPage+
                "&limit=24"+
                "&sfw=true"
            );

        hasNextPage =
            result.pagination?.has_next_page || false;

        render(result.data || []);

        updateLoadButton();

    }catch(error){

        showError();

    }

    setLoading(false);

}


/* LOAD MORE */

async function loadMore(){

    if(!hasNextPage)
        return;

    const button =
        document.getElementById("loadMore");

    button.classList.add("loading");

    button.textContent =
        text[language].loading;

    currentPage++;

    try{

        let url;

        if(currentMode==="search"){

            url =
                API+
                "/anime?q="+
                encodeURIComponent(currentQuery)+
                "&page="+
                currentPage+
                "&limit=24"+
                "&sfw=true";

        }

        else if(currentMode==="season"){

            url =
                API+
                "/seasons/now?page="+
                currentPage+
                "&limit=24";

        }

        else{

            url =
                API+
                "/top/anime?page="+
                currentPage+
                "&limit=24";

        }

        const result =
            await api(url);

        hasNextPage =
            result.pagination?.has_next_page || false;

        render(
            result.data || [],
            true
        );

    }catch(error){

        currentPage--;

    }

    button.classList.remove("loading");

    updateLoadButton();

}


/* RENDER */

function render(list,append=false){

    const grid =
        document.getElementById("grid");

    if(!append)
        grid.innerHTML="";

    if(!list.length && !append){

        document.getElementById("empty")
            .style.display="block";

        return;

    }

    document.getElementById("empty")
        .style.display="none";

    list.forEach(
        (anime,index)=>{

            if(!anime.images?.jpg)
                return;

            const title =
                anime.title ||
                anime.title_english ||
                "Unknown Anime";

            const image =
                anime.images.jpg.large_image_url ||
                anime.images.jpg.image_url;

            const episodes =
