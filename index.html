<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070b">

<title>Seyha Anime KH</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07070b;
  --bg2:#101017;
  --card:#14141d;
  --border:#282832;
  --purple:#9b59ff;
  --purple2:#712de0;
  --white:#fff;
  --muted:#92929f;
}

body{
  background:var(--bg);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  touch-action:manipulation;
}

/* NAVBAR */

.navbar{
  height:68px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#101016ee;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(12px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#b66cff,#6725e8);
  box-shadow:0 0 20px #7b32e944;
}

.logo-purple{
  color:#a96aff;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.language-top,
.menu-button{
  border:1px solid #33333e;
  background:#181820;
  color:white;
  border-radius:9px;
  cursor:pointer;
}

.language-top{
  padding:9px 12px;
}

.menu-button{
  width:42px;
  height:42px;
  font-size:21px;
}

/* HERO */

.hero{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:55px 16px;

  background:
    linear-gradient(#08080dcc,#08080df5),
    url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1200&q=70");

  background-size:cover;
  background-position:center;
}

.hero h1{
  font-size:clamp(34px,7vw,58px);
  margin-bottom:10px;
}

.hero p{
  color:#aaa;
  margin-bottom:24px;
}

/* SEARCH */

.search{
  width:min(720px,94vw);
  height:56px;
  display:flex;
  overflow:hidden;
  border-radius:12px;
  border:1px solid #393944;
  background:#15151eef;
  box-shadow:0 12px 35px #0008;
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:0 17px;
  font-size:15px;
}

.search button{
  width:105px;
  border:0;
  background:linear-gradient(135deg,#a65cff,#7028dc);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* CONTENT */

.container{
  width:92%;
  max-width:1450px;
  margin:38px auto;
}

.section-title{
  font-size:24px;
  margin-bottom:18px;
}

.section-title span{
  color:#a96aff;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:24px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex-shrink:0;
  border:1px solid var(--border);
  background:#15151d;
  color:#aaa;
  padding:9px 15px;
  border-radius:8px;
  cursor:pointer;
}

.tab.active,
.tab:hover{
  color:white;
  background:var(--purple2);
  border-color:#9250ee;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:17px;
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:10px;
  background:var(--card);
  border:1px solid #20202a;
  cursor:pointer;
  transition:.2s;
  contain:layout paint;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#7838d7;
  box-shadow:0 12px 28px #0008;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1b1b24;
}

.info{
  padding:11px;
}

.title{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:6px;
}

.meta{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rating{
  margin-top:6px;
  font-size:11px;
  color:#ffc857;
}

/* FAVORITE */

.favorite{
  position:absolute;
  top:7px;
  right:7px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#000c;
  color:white;
  font-size:18px;
  cursor:pointer;
  z-index:5;
}

.favorite.active{
  color:#ff4b91;
}

/* LOAD MORE */

.load-area{
  display:flex;
  justify-content:center;
  margin:30px 0;
}

.load-more{
  display:none;
  padding:12px 25px;
  border:1px solid #8240e4;
  border-radius:9px;
  background:#702bd8;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.load-more.show{
  display:block;
}

.load-more.loading{
  opacity:.6;
  pointer-events:none;
}

/* LOADING */

.loading{
  display:none;
  justify-content:center;
  padding:35px;
}

.loading.show{
  display:flex;
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid #333;
  border-top-color:#9b59ff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* EMPTY */

.empty{
  text-align:center;
  padding:55px 15px;
  color:#777;
  display:none;
}

.empty.show{
  display:block;
}

/* ERROR */

.error{
  max-width:700px;
  margin:15px auto;
  padding:13px;
  border:1px solid #49365f;
  background:#1a1422;
  color:#cdb4e8;
  border-radius:9px;
  text-align:center;
  display:none;
}

.error.show{
  display:block;
}

/* DRAWER */

.overlay{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:2000;
  display:none;
}

.overlay.show{
  display:block;
}

.drawer{
  position:fixed;
  top:0;
  right:0;
  width:min(340px,88vw);
  height:100%;
  background:#111119;
  border-left:1px solid #292934;
  z-index:2100;
  transform:translateX(100%);
  transition:transform .25s ease;
  padding:22px;
  box-shadow:-20px 0 60px #0009;
}

.drawer.show{
  transform:translateX(0);
}

.drawer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.close,
.modal-close{
  border:0;
  background:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.drawer-label{
  color:#777;
  font-size:11px;
  text-transform:uppercase;
  margin:17px 5px 9px;
}

.language-buttons{
  display:flex;
  gap:8px;
}

.language-buttons button{
  flex:1;
  padding:11px;
  border-radius:8px;
  border:1px solid #343440;
  background:#191923;
  color:#aaa;
  cursor:pointer;
}

.language-buttons button.selected{
  background:#762de0;
  color:white;
  border-color:#9955ff;
}

.drawer-item{
  width:100%;
  text-align:left;
  border:0;
  border-radius:8px;
  padding:14px;
  background:transparent;
  color:#bbb;
  font-size:15px;
  cursor:pointer;
}

.drawer-item:hover{
  background:#22202d;
  color:white;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:#000d;
  z-index:3000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(900px,96vw);
  max-height:90vh;
  overflow:auto;
  background:#15151e;
  border:1px solid #30303c;
  border-radius:14px;
  padding:22px;
}

.detail{
  display:flex;
  gap:22px;
  padding-top:5px;
}

.detail-poster{
  width:205px;
  height:300px;
  object-fit:cover;
  border-radius:9px;
  background:#222;
}

.detail h2{
  font-size:27px;
  margin:25px 0 11px;
}

.detail p{
  color:#aaa;
  line-height:1.65;
}

.detail-line{
  color:#aaa;
  font-size:13px;
  margin:7px 0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:14px 0;
}

.tag{
  background:#24202f;
  color:#cdaeff;
  padding:6px 9px;
  border-radius:6px;
  font-size:11px;
}

.official{
  display:inline-block;
  margin-top:12px;
  padding:10px 14px;
  border-radius:8px;
  background:#702bd8;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* FOOTER */

footer{
  margin-top:65px;
  padding:30px;
  text-align:center;
  color:#666;
  background:#101016;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .grid{
    grid-template-columns:repeat(5,1fr);
  }
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:650px){

  .grid{
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }

  .info{
    padding:9px;
  }

  .title{
    font-size:13px;
  }
}

@media(max-width:500px){

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:11px;
  }

  .language-top{
    display:none;
  }

  .detail{
    flex-direction:column;
  }

  .detail-poster{
    width:165px;
    height:245px;
    margin:auto;
  }

  .detail h2{
    font-size:21px;
  }

  .modal{
    padding:8px;
  }

  .modal-box{
    padding:17px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

  <div class="logo">

    <div class="logo-icon">
      ✦
    </div>

    <div>
      Seyha <span class="logo-purple">Anime KH</span>
    </div>

  </div>

  <div class="nav-right">

    <button
      class="language-top"
      id="languageTop"
      onclick="toggleLanguage()">
      🇬🇧 EN
    </button>

    <button
      class="menu-button"
      onclick="openMenu()">
      ☰
    </button>

  </div>

</nav>


<!-- HERO -->

<section class="hero">

  <div>

    <h1 id="heroTitle">
      Find Your Anime
    </h1>

    <p id="heroSubtitle">
      Search thousands of anime titles
    </p>

    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="Search anime..."
        autocomplete="off">

      <button
        id="searchButton"
        onclick="startSearch()">
        Search
      </button>

    </div>

  </div>

</section>


<!-- CONTENT -->

<main class="container">

  <h2 class="section-title">
    🔥 <span id="sectionTitle">Top Anime</span>
  </h2>


  <div class="tabs">

    <button
      class="tab active"
      onclick="loadTop(this)">
      🔥 Top
    </button>

    <button
      class="tab"
      onclick="loadSeason(this)">
      🆕 Seasonal
    </button>

    <button
      class="tab"
      onclick="showFavorites(this)">
      ❤️ Favorites
    </button>

  </div>


  <div
    id="error"
    class="error">
  </div>


  <div
    id="loading"
    class="loading">

    <div class="spinner"></div>

  </div>


  <div
    id="grid"
    class="grid">
  </div>


  <div
    id="empty"
    class="empty">

    No anime found.

  </div>


  <div class="load-area">

    <button
      id="loadMore"
      class="load-more"
      onclick="loadMore()">

      Load More

    </button>

  </div>

</main>


<footer>
  Seyha Anime KH © 2026
</footer>


<!-- MENU -->

<div
  id="overlay"
  class="overlay"
  onclick="closeMenu()">
</div>


<aside
  id="drawer"
  class="drawer">

  <div class="drawer-header">

    <h2>
      Seyha Anime KH
    </h2>

    <button
      class="close"
      onclick="closeMenu()">
      ×
    </button>

  </div>


  <div class="drawer-label">
    Language / ភាសា
  </div>


  <div class="language-buttons">

    <button
      id="englishButton"
      onclick="setLanguage('en')">

      🇬🇧 English

    </button>

    <button
      id="khmerButton"
      onclick="setLanguage('kh')">

      🇰🇭 ខ្មែរ

    </button>

  </div>


  <div class="drawer-label">
    Navigation
  </div>


  <button
    class="drawer-item"
    onclick="loadTop();closeMenu()">

    🔥
    <span
      data-en="Top Anime"
      data-kh="Anime ល្បីៗ">
      Top Anime
    </span>

  </button>


  <button
    class="drawer-item"
    onclick="loadSeason();closeMenu()">

    🆕
    <span
      data-en="Seasonal Anime"
      data-kh="Anime រដូវកាល">
      Seasonal Anime
    </span>

  </button>


  <button
    class="drawer-item"
    onclick="showFavorites();closeMenu()">

    ❤️
    <span
      data-en="Favorites"
      data-kh="ចំណូលចិត្ត">
      Favorites
    </span>

  </button>

</aside>


<!-- DETAIL MODAL -->

<div
  id="modal"
  class="modal"
  onclick="if(event.target===this)closeModal()">

  <div class="modal-box">

    <button
      class="modal-close"
      onclick="closeModal()">
      ×
    </button>

    <div id="detailContent"></div>

  </div>

</div>


<script>

/* =========================================
   SEYHA ANIME KH V4
   ========================================= */

"use strict";


/* API */

const API =
  "https://api.jikan.moe/v4";


/* SETTINGS */

const LIMIT = 12;

const REQUEST_GAP = 900;


/* STATE */

let currentPage = 1;

let currentMode = "top";

let currentQuery = "";

let hasNextPage = false;

let busy = false;

let lastRequest = 0;


/* LANGUAGE */

let language =
  localStorage.getItem("language") || "en";


/* FAVORITES */

let favorites = [];

try{

  favorites =
    JSON.parse(
      localStorage.getItem("favorites") || "[]"
    );

}catch(e){

  favorites = [];

}


/* TRANSLATION */

const text = {

  en:{

    hero:"Find Your Anime",

    subtitle:
      "Search thousands of anime titles",

    search:"Search",

    top:"Top Anime",

    season:"Seasonal Anime",

    fav:"Favorites",

    no:"No anime found.",

    load:"Load More",

    loading:"Loading...",

    error:
      "Could not load anime. Please try again."

  },


  kh:{

    hero:
      "ស្វែងរក Anime របស់អ្នក",

    subtitle:
      "ស្វែងរក Anime រាប់ពាន់ចំណងជើង",

    search:"ស្វែងរក",

    top:
      "Anime ល្បីៗ",

    season:
      "Anime រដូវកាល",

    fav:
      "ចំណូលចិត្ត",

    no:
      "រកមិនឃើញ Anime ទេ។",

    load:
      "បង្ហាញបន្ថែម",

    loading:
      "កំពុងផ្ទុក...",

    error:
      "មិនអាចផ្ទុក Anime បានទេ។ សូមសាកម្ដងទៀត។"

  }

};


/* HELPER */

function $(id){

  return document.getElementById(id);

}


/* SAVE FAVORITES */

function saveFavorites(){

  localStorage.setItem(
    "favorites",
    JSON.stringify(favorites)
  );

}


/* LANGUAGE */

function setLanguage(value){

  language = value;

  localStorage.setItem(
    "language",
    value
  );

  applyLanguage();

  closeMenu();

}


function toggleLanguage(){

  setLanguage(
    language === "en"
      ? "kh"
      : "en"
  );

}


/* APPLY LANGUAGE */

function applyLanguage(){

  const t =
    text[language];


  $("heroTitle").textContent =
    t.hero;


  $("heroSubtitle").textContent =
    t.subtitle;


  $("searchButton").textContent =
    t.search;


  $("languageTop").textContent =
    language === "en"
      ? "🇬🇧 EN"
      : "🇰🇭 KH";


  $("empty").textContent =
    t.no;


  $("loadMore").textContent =
    t.load;


  document
    .querySelectorAll("[data-en]")
    .forEach(el => {

      el.textContent =
        el.dataset[language];

    });


  $("englishButton")
    .classList
    .toggle(
      "selected",
      language === "en"
    );


  $("khmerButton")
    .classList
    .toggle(
      "selected",
      language === "kh"
    );


  updateSectionTitle();

}


/* SECTION TITLE */

function updateSectionTitle(){

  let title;


  if(currentMode === "search"){

    title =
      language === "en"
        ? "Search Results"
        : "លទ្ធផលស្វែងរក";

  }

  else if(currentMode === "season"){

    title =
      text[language].season;

  }

  else if(currentMode === "favorites"){

    title =
      text[language].fav;

  }

  else{

    title =
      text[language].top;

  }


  $("sectionTitle").textContent =
    title;

}


/* LOADING */

function setLoading(on){

  $("loading")
    .classList
    .toggle(
      "show",
      on
    );

}


/* ERROR */

function showError(){

  $("error")
    .textContent =
    text[language].error;

  $("error")
    .classList
    .add("show");

}


function hideError(){

  $("error")
    .classList
    .remove("show");

}


/* WAIT */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* API REQUEST */

async function api(path){

  const now =
    Date.now();


  const gap =
    REQUEST_GAP -
    (now - lastRequest);


  if(gap > 0){

    await wait(gap);

  }


  lastRequest =
    Date.now();


  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () =>
        controller.abort(),
      10000
    );


  try{

    const response =
      await fetch(
        API + path,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    return await response.json();

  }

  finally{

    clearTimeout(timer);

  }

}


/* RESET */

function resetView(){

  $("grid").innerHTML = "";

  $("empty")
    .classList
    .remove("show");

  hideError();

  $("loadMore")
    .classList
    .remove("show");

}


/* TOP ANIME */

async function loadTop(button){

  if(busy)
    return;


  if(button)
    activateTab(button);


  currentMode =
    "top";

  currentPage =
    1;

  currentQuery =
    "";

  hasNextPage =
    false;


  resetView();

  updateSectionTitle();

  setLoading(true);

  busy = true;


  try{

    const result =
      await api(
        "/top/anime?page=1&limit=" +
        LIMIT +
        "&sfw=true"
      );


    hasNextPage =
      !!result
        .pagination
        ?.has_next_page;


    render(
      result.data || []
    );

  }

  catch(error){

    showError();

  }

  finally{

    busy = false;

    setLoading(false);

    updateLoadButton();

  }

}


/* SEASONAL */

async function loadSeason(button){

  if(busy)
    return;


  if(button)
    activateTab(button);


  currentMode =
    "season";

  currentPage =
    1;

  currentQuery =
    "";

  hasNextPage =
    false;


  resetView();

  updateSectionTitle();

  setLoading(true);

  busy = true;


  try{

    const result =
      await api(
        "/seasons/now?page=1&limit=" +
        LIMIT
      );


    hasNextPage =
      !!result
        .pagination
        ?.has_next_page;


    render(
      result.data || []
    );

  }

  catch(error){

    showError();

  }

  finally{

    busy = false;

    setLoading(false);

    updateLoadButton();

  }

}


/* SEARCH */

async function startSearch(){

  if(busy)
    return;


  const input =
    $("searchInput")
      .value
      .trim();


  if(!input){

    loadTop();

    return;

  }


  currentMode =
    "search";

  currentPage =
    1;

  currentQuery =
    input;

  hasNextPage =

        encodeURIComponent(

        ) +

        LIMIT;

        "/top/anime?page=" +
        next +
        "&limit=" +
        LIMIT +
        "&sfw=true";

    }


    const result =
      await api(path);


    currentPage =
      next;

      !!result
        .pagination
        ?.has_next_page;

      result.data || [],

  }

  catch(error){

    showError();

  }

    busy = false;

    button.classList
      .remove("loading");

    updateLoadButton();

  }

}
